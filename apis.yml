aid: calastone
name: Calastone
description: 'Calastone operates the world''s largest global funds network, connecting
  asset managers, distributors, custodians and platforms to automate and digitalize
  the investment funds marketplace. Founded in 2007 and headquartered in London, it
  provides order routing, settlements, share-class conversions, dividends, transfers,
  reporting, money market services and tokenized fund distribution. More than 4,500
  clients across 58 countries and territories use the network, processing over £300
  billion of investment value each month. API and messaging connectivity is delivered
  through client onboarding rather than a public self-service developer portal. Calastone
  is a wholly owned subsidiary of SS&C Technologies Holdings, Inc. (Nasdaq: SSNC).'
